zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: a571c0d144b14fd4a87a9d9b2aa9fcd6
    name: Templates/Applications
  templates:
  - uuid: 8f0ad061cf794440882cb45995b674b2
    template: TrueNAS SCALE by SNMP
    name: TrueNAS SCALE by SNMP
    description: 'Template for monitoring TrueNAS SCALE by SNMP.


      Setup:

      1. Import the template into Zabbix.

      2. Enable SNMP daemon at Services in TrueNAS SCALE web interface: https://www.truenas.com/docs/core/uireference/services/snmpscreen/

      3. Link the template to the host.


      MIBs used:

      HOST-RESOURCES-MIB

      SNMPv2-MIB

      UCD-DISKIO-MIB

      UCD-SNMP-MIB

      TRUENAS-MIB


      Generated by official Zabbix template tool "Templator"

      '
    vendor:
      name: Zabbix
      version: 7.0-2
    groups:
    - name: Templates/Applications
    items:
    - uuid: 765d339d7d624b129a3619a8a7e711aa
      name: ICMP ping
      type: SIMPLE
      key: icmpping
      description: 'The host accessibility by ICMP ping.


        0 - ICMP ping fails;

        1 - ICMP ping successful.

        '
      valuemap:
        name: Service state
      tags:
      - tag: component
        value: health
      - tag: component
        value: network
      triggers:
      - uuid: 0f9bdde1a8644d1787d93923ee51c56d
        expression: max(/TrueNAS SCALE by SNMP/icmpping,#3)=0
        name: 'TrueNAS SCALE: Unavailable by ICMP ping'
        priority: HIGH
        description: Last three attempts returned timeout. Please check device connectivity.
        tags:
        - tag: scope
          value: availability
    - uuid: 48ff937de501472e9a7398e47ac15e17
      name: ICMP loss
      type: SIMPLE
      key: icmppingloss
      value_type: FLOAT
      units: '%'
      description: The percentage of lost packets.
      tags:
      - tag: component
        value: health
      - tag: component
        value: network
      triggers:
      - uuid: b6a6fa5db70549d59f4383f5f7007ac0
        expression: min(/TrueNAS SCALE by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/TrueNAS SCALE by SNMP/icmppingloss,5m)<100
        name: 'TrueNAS SCALE: High ICMP ping loss'
        opdata: 'Loss: {ITEM.LASTVALUE1}'
        priority: WARNING
        description: ICMP packets loss detected.
        dependencies:
        - name: 'TrueNAS SCALE: Unavailable by ICMP ping'
          expression: max(/TrueNAS SCALE by SNMP/icmpping,#3)=0
        tags:
        - tag: scope
          value: availability
        - tag: scope
          value: performance
    - uuid: 1854f5635db64503a364ada222a2d632
      name: ICMP response time
      type: SIMPLE
      key: icmppingsec
      value_type: FLOAT
      units: s
      description: The ICMP ping response time (in seconds).
      tags:
      - tag: component
        value: health
      - tag: component
        value: network
      triggers:
      - uuid: 80add7a7c5e64743b7a3f4fd3e308317
        expression: avg(/TrueNAS SCALE by SNMP/icmppingsec,5m)>{$ICMP_RESPONSE_TIME_WARN}
        name: 'TrueNAS SCALE: High ICMP ping response time'
        opdata: 'Value: {ITEM.LASTVALUE1}'
        priority: WARNING
        description: Average ICMP response time is too high.
        dependencies:
        - name: 'TrueNAS SCALE: High ICMP ping loss'
          expression: min(/TrueNAS SCALE by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/TrueNAS SCALE by SNMP/icmppingloss,5m)<100
        - name: 'TrueNAS SCALE: Unavailable by ICMP ping'
          expression: max(/TrueNAS SCALE by SNMP/icmpping,#3)=0
        tags:
        - tag: scope
          value: availability
        - tag: scope
          value: performance
    - uuid: 31cafd3e2acc4db59728574f313505d5
      name: 'TrueNAS SCALE: SNMP walk network interfaces'
      type: SNMP_AGENT
      snmp_oid: walk[1.3.6.1.2.1.2.2.1.8,1.3.6.1.2.1.2.2.1.7,1.3.6.1.2.1.31.1.1.1.18,1.3.6.1.2.1.31.1.1.1.1,1.3.6.1.2.1.2.2.1.2,1.3.6.1.2.1.2.2.1.3,1.3.6.1.2.1.31.1.1.1.6,1.3.6.1.2.1.31.1.1.1.10,1.3.6.1.2.1.2.2.1.14,1.3.6.1.2.1.2.2.1.20,1.3.6.1.2.1.2.2.1.19,1.3.6.1.2.1.2.2.1.13,1.3.6.1.2.1.31.1.1.1.15]
      key: net.if.walk
