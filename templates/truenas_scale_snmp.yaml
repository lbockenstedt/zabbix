  triggers:
  - uuid: 55767ce57f2e4d3ab3c2f65dc136bdd2
    expression: min(/TrueNAS SCALE by SNMP/system.swap.pfree,5m)<{$SWAP.PFREE.MIN.WARN} and last(/TrueNAS SCALE by SNMP/system.swap.total)>0
    name: 'TrueNAS SCALE: High swap space usage'
    event_name: 'TrueNAS SCALE: High swap space usage (less than {$SWAP.PFREE.MIN.WARN}% free)'
    opdata: 'Free: {ITEM.LASTVALUE1}, total: {ITEM.LASTVALUE2}'
    priority: WARNING
    description: If there is no swap configured, this trigger is ignored.
    dependencies:
    - name: 'TrueNAS SCALE: High memory utilization'
      expression: min(/TrueNAS SCALE by SNMP/vm.memory.util,5m)>{$MEMORY.UTIL.MAX}
    - name: 'TrueNAS SCALE: Lack of available memory'
      expression: min(/TrueNAS SCALE by SNMP/vm.memory.available,5m)<{$MEMORY.AVAILABLE.MIN} and last(/TrueNAS SCALE by SNMP/vm.memory.total)>0
    tags:
    - tag: scope
      value: capacity
    - tag: scope
      value: performance
  - uuid: 7c2de78d237c409083458da8a17882b6
    expression: (last(/TrueNAS SCALE by SNMP/system.hw.uptime[hrSystemUptime.0])>0 and last(/TrueNAS SCALE by SNMP/system.hw.uptime[hrSystemUptime.0])<10m) or (last(/TrueNAS SCALE by SNMP/system.hw.uptime[hrSystemUptime.0])=0 and last(/TrueNAS SCALE by SNMP/system.net.uptime[sysUpTime.0])<10m)
    name: 'TrueNAS SCALE: Host has been restarted'
    event_name: 'TrueNAS SCALE: {HOST.NAME} has been restarted (uptime < 10m)'
    priority: WARNING
    description: Uptime is less than 10 minutes.
    manual_close: 'YES'
    dependencies:
    - name: 'TrueNAS SCALE: No SNMP data collection'
      expression: max(/TrueNAS SCALE by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
    tags:
    - tag: scope
      value: notice
  - uuid: 881c338a65284a8494d41d9219de95d5
    expression: min(/TrueNAS SCALE by SNMP/vm.memory.available,5m)<{$MEMORY.AVAILABLE.MIN} and last(/TrueNAS SCALE by SNMP/vm.memory.total)>0
    name: 'TrueNAS SCALE: Lack of available memory'
    event_name: 'TrueNAS SCALE: Lack of available memory (<{$MEMORY.AVAILABLE.MIN} of {ITEM.VALUE2})'
    opdata: 'Available: {ITEM.LASTVALUE1}, total: {ITEM.LASTVALUE2}'
    priority: AVERAGE
    description: The system is running out of memory.
    tags:
    - tag: scope
      value: capacity
    - tag: scope
      value: performance
  - uuid: b9b096226b924d6ea12e5ec5ec4bf363
    expression: 'min(/TrueNAS SCALE by SNMP/system.cpu.load.avg1,5m)/last(/TrueNAS SCALE by SNMP/system.cpu.num)>{$LOAD_AVG_PER_CPU.MAX.WARN}

      and last(/TrueNAS SCALE by SNMP/system.cpu.load.avg5)>0

      and last(/TrueNAS SCALE by SNMP/system.cpu.load.avg15)>0

      '
    name: 'TrueNAS SCALE: Load average is too high'
    event_name: 'TrueNAS SCALE: Load average is too high (per CPU load over {$LOAD_AVG_PER_CPU.MAX.WARN} for 5m)'
    opdata: 'Load averages(1m 5m 15m): ({ITEM.LASTVALUE1} {ITEM.LASTVALUE3} {ITEM.LASTVALUE4}), # of CPUs: {ITEM.LASTVALUE2}'
    priority: AVERAGE
    description: The load average per CPU is too high. The system may be slow to respond.
    tags:
    - tag: scope
      value: performance
