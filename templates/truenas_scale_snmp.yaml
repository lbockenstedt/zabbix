    - uuid: b22948ac19d848e08d93d991710d405a
      name: ZFS pools discovery
      type: DEPENDENT
      key: truenas.zfs.pools.discovery
      delay: '0'
      description: ZFS pools discovery from TRUENAS-MIB.
      item_prototypes:
      - uuid: 774002ebd3d949ec9fce14ad58ed863b
        name: 'Pool [{#POOLNAME}]: Health'
        type: DEPENDENT
        key: truenas.zpool.health[{#POOLNAME}]
        delay: '0'
        description: 'MIB: TRUENAS-MIB

          The current health of the containing pool, as reported by zpool status.

          '
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.4.1.50536.1.1.1.1.3.{#SNMPINDEX}
          - '0'
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1h
        master_item:
          key: truenas.zfs.pools.walk
        tags:
        - tag: component
          value: health
        - tag: component
          value: storage
        - tag: pool
          value: '{#POOLNAME}'
        trigger_prototypes:
        - uuid: cd704808236b478a83ac6775cf947da0
          expression: last(/TrueNAS SCALE by SNMP/truenas.zpool.health[{#POOLNAME}]) <>"ONLINE"
          name: 'TrueNAS SCALE: Pool [{#POOLNAME}]: Status is not online'
          opdata: 'Current state: {ITEM.LASTVALUE1}'
          priority: AVERAGE
          description: Please check pool status.
          tags:
          - tag: scope
            value: availability
        value_type: CHAR
      - uuid: 191b6c41395b4c60a5347361602dcf1c
        name: 'Pool [{#POOLNAME}]: Read rate'
        type: DEPENDENT
        key: truenas.zpool.read.bytes[{#POOLNAME}]
        delay: '0'
        value_type: FLOAT
        units: Bps
        description: 'MIB: TRUENAS-MIB

          The bandwidth of all read operations (including metadata), expressed as units per second (averaged since system booted).

          '
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.4.1.50536.1.1.1.1.6.{#SNMPINDEX}
          - '0'
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        master_item:
          key: truenas.zfs.pools.walk
        tags:
        - tag: component
          value: storage
        - tag: pool
          value: '{#POOLNAME}'
      - uuid: bff2471641ab40518ec70b51b910787f
        name: 'Pool [{#POOLNAME}]: Read operations rate'
        type: DEPENDENT
        key: truenas.zpool.read.ops[{#POOLNAME}]
        delay: '0'
        value_type: FLOAT
        units: IOPS
        description: 'MIB: TRUENAS-MIB

          The number of read I/O operations sent to the pool or device, including metadata requests (averaged since system booted).

          '
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.4.1.50536.1.1.1.1.4.{#SNMPINDEX}
          - '0'
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        master_item:
          key: truenas.zfs.pools.walk
        tags:
        - tag: component
          value: storage
        - tag: pool
          value: '{#POOLNAME}'
      - uuid: 4fa9ffe8764c45c5bcd3bcbd2dd6d346
        name: 'Pool [{#POOLNAME}]: Write rate'
        type: DEPENDENT
        key: truenas.zpool.write.bytes[{#POOLNAME}]
        delay: '0'
        value_type: FLOAT
        units: Bps
        description: 'MIB: TRUENAS-MIB

          The bandwidth of all write operations, expressed as units per second (averaged since system booted).

          '
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.4.1.50536.1.1.1.1.7.{#SNMPINDEX}
          - '0'
        - type: CHANGE_PER_SECOND
          parameters:
