    - uuid: efe522dcefe14df18f2ee18ce93bba83
      name: Available memory
      type: CALCULATED
      key: vm.memory.available
      units: B
      params: last(//vm.memory.free)+last(//vm.memory.buffers)+last(//vm.memory.cached)
      description: Please note that memory utilization is a rough estimate, since memory available is calculated as free+buffers+cached, which is not 100% accurate, but the best we can get using SNMP.
      tags:
      - tag: component
        value: memory
    - uuid: c09cc9a288704d9aacffc422df15e281
      name: Memory (buffers)
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2021.4.14.0]
      key: vm.memory.buffers
      units: B
      description: 'MIB: UCD-SNMP-MIB

        The total amount of real or virtual memory currently allocated for use as memory buffers.

        '
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '1024'
      tags:
      - tag: component
        value: memory
    - uuid: 88f51342ae794535a2fc7eede6629341
      name: Memory (cached)
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2021.4.15.0]
      key: vm.memory.cached
      units: B
      description: 'MIB: UCD-SNMP-MIB

        The total amount of real or virtual memory currently allocated for use as cached memory.

        '
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '1024'
      tags:
      - tag: component
        value: memory
    - uuid: 2d7779513628415a9e8c804dd412109b
      name: Free memory
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2021.4.6.0]
      key: vm.memory.free
      units: B
      description: 'MIB: UCD-SNMP-MIB

        The amount of real/physical memory currently unused or available.

        '
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '1024'
      tags:
      - tag: component
        value: memory
    - uuid: 7142d0912b5840b2ab78cf647d08995b
      name: Total memory
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2021.4.5.0]
      key: vm.memory.total
      units: B
      description: 'MIB: UCD-SNMP-MIB

        The total memory expressed in bytes.

        '
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '1024'
      tags:
      - tag: component
        value: memory
    - uuid: 5fc5e26d66614d2abc35ffca4b5706db
      name: Memory utilization
      type: CALCULATED
      key: vm.memory.util
      value_type: FLOAT
      units: '%'
      params: (last(//vm.memory.total)-(last(//vm.memory.free)+last(//vm.memory.buffers)+last(//vm.memory.cached)))/last(//vm.memory.total)*100
      description: Please note that memory utilization is a rough estimate, since memory available is calculated as free+buffers+cached, which is not 100% accurate, but the best we can get using SNMP.
      tags:
      - tag: component
        value: memory
      triggers:
      - uuid: 08d903b587e54d63a2a68f3d00d55a5f
        expression: min(/TrueNAS SCALE by SNMP/vm.memory.util,5m)>{$MEMORY.UTIL.MAX}
        name: 'TrueNAS SCALE: High memory utilization'
        event_name: 'TrueNAS SCALE: High memory utilization (>{$MEMORY.UTIL.MAX}% for 5m)'
        priority: AVERAGE
        description: The system is running out of free memory.
        dependencies:
        - name: 'TrueNAS SCALE: Lack of available memory'
          expression: min(/TrueNAS SCALE by SNMP/vm.memory.available,5m)<{$MEMORY.AVAILABLE.MIN} and last(/TrueNAS SCALE by SNMP/vm.memory.total)>0
        tags:
        - tag: scope
          value: capacity
        - tag: scope
          value: performance
    - uuid: 33534767c04f458da2643b89b7c9665e
      name: SNMP agent availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      description: 'Availability of SNMP checks on the host. The value of this item corresponds to availability icons in the host list.

        Possible values:

        0 - not available

        1 - available

        2 - unknown

        '
      valuemap:
        name: zabbix.host.available
      tags:
      - tag: component
        value: health
      - tag: component
        value: network
      triggers:
      - uuid: 266419bf14d7401cb5163c31b7dcc635
        expression: max(/TrueNAS SCALE by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'TrueNAS SCALE: No SNMP data collection'
        opdata: 'Current state: {ITEM.LASTVALUE1}'
        priority: WARNING
        description: SNMP is not available for polling. Please check device connectivity and SNMP settings.
        dependencies:
        - name: 'TrueNAS SCALE: Unavailable by ICMP ping'
          expression: max(/TrueNAS SCALE by SNMP/icmpping,#3)=0
        tags:
        - tag: scope
          value: availability
    discovery_rules:
    - uuid: 4a16e8f5c8454af69d79e580b74eeebe
      name: CPU discovery
      type: DEPENDENT
      key: cpu.discovery
      delay: '0'
      description: This discovery will create set of per core CPU metrics from UCD-SNMP-MIB, using {#CPU.COUNT} in preprocessing. That's the only reason why LLD is used.
      item_prototypes:
      - uuid: c57cd1152ca64095aa06caf1aa91b7e9
        name: CPU idle time
        type: DEPENDENT
        key: system.cpu.idle[{#SNMPINDEX}]
        delay: '0'
        value_type: FLOAT
        units: '%'
        description: 'MIB: UCD-SNMP-MIB

          The time the CPU has spent doing nothing.

          '
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.4.1.2021.11.11.0
          - '0'
        master_item:
          key: system.cpu.walk
        tags:
        - tag: component
          value: cpu
      - uuid: 9824a9f434924410b78ebf9c7fb6ef4d
        name: CPU interrupt time
        type: DEPENDENT
        key: system.cpu.interrupt[{#SNMPINDEX}]
        delay: '0'
        value_type: FLOAT
        units: '%'
        description: 'MIB: UCD-SNMP-MIB

          The amount of time the CPU has been servicing hardware interrupts.

          '
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.4.1.2021.11.56.0
          - '0'
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: JAVASCRIPT
          parameters:
          - return value/{#CPU.COUNT}
        master_item:
          key: system.cpu.walk
        tags:
        - tag: component
          value: cpu
      - uuid: d54a46ed546b4ac68bff65d1e0f2ccb8
        name: CPU iowait time
        type: DEPENDENT
        key: system.cpu.iowait[{#SNMPINDEX}]
        delay: '0'
        value_type: FLOAT
        units: '%'
        description: 'MIB: UCD-SNMP-MIB

          The amount of time the CPU has been waiting for I/O to complete.

          '
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.4.1.2021.11.54.0
          - '0'
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: JAVASCRIPT
          parameters:
          - return value/{#CPU.COUNT}
        master_item:
          key: system.cpu.walk
        tags:
        - tag: component
          value: cpu
      - uuid: 2391a069f265461d83132de38bc67e01
        name: CPU nice time
        type: DEPENDENT
        key: system.cpu.nice[{#SNMPINDEX}]
        delay: '0'
        value_type: FLOAT
        units: '%'
        description: 'MIB: UCD-SNMP-MIB

          The time the CPU has spent running users'' processes that have been niced.

          '
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.4.1.2021.11.51.0
          - '0'
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: JAVASCRIPT
          parameters:
          - return value/{#CPU.COUNT}
        master_item:
          key: system.cpu.walk
        tags:
        - tag: component
          value: cpu
      - uuid: 9041a4026a6946728eb9d00e7de3efc5
        name: CPU system time
        type: DEPENDENT
        key: system.cpu.system[{#SNMPINDEX}]
        delay: '0'
        value_type: FLOAT
        units: '%'
        description: 'MIB: UCD-SNMP-MIB

          The time the CPU has spent running the kernel and its processes.

          '
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.4.1.2021.11.52.0
          - '0'
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: JAVASCRIPT
          parameters:
          - return value/{#CPU.COUNT}
        master_item:
          key: system.cpu.walk
        tags:
        - tag: component
          value: cpu
      - uuid: 5f226ac6afb246879dd1464265fb6117
        name: CPU user time
        type: DEPENDENT
        key: system.cpu.user[{#SNMPINDEX}]
        delay: '0'
        value_type: FLOAT
        units: '%'
        description: 'MIB: UCD-SNMP-MIB

          The time the CPU has spent running users'' processes that are not niced.

          '
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.4.1.2021.11.50.0
          - '0'
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: JAVASCRIPT
          parameters:
          - return value/{#CPU.COUNT}
        master_item:
          key: system.cpu.walk
        tags:
        - tag: component
          value: cpu
      - uuid: ea192279ccfb40c589e6bc642bacd57a
        name: CPU utilization
        type: DEPENDENT
        key: system.cpu.util[{#SNMPINDEX}]
        delay: '0'
        value_type: FLOAT
        units: '%'
        description: The CPU utilization expressed in %.
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - return (100 - value)
        master_item:
          key: system.cpu.idle[{#SNMPINDEX}]
        tags:
        - tag: component
          value: cpu
        trigger_prototypes:
        - uuid: 8aacec5a581549f2ae2e5dfffc0aa5ba
          expression: min(/TrueNAS SCALE by SNMP/system.cpu.util[{#SNMPINDEX}],5m)>{$CPU.UTIL.CRIT}
          name: 'TrueNAS SCALE: High CPU utilization'
          event_name: 'TrueNAS SCALE: High CPU utilization (over {$CPU.UTIL.CRIT}% for 5m)'
          opdata: 'Current utilization: {ITEM.LASTVALUE1}'
          priority: WARNING
          description: The CPU utilization is too high. The system might be slow to respond.
          dependencies:
          - name: 'TrueNAS SCALE: Load average is too high'
            expression: 'min(/TrueNAS SCALE by SNMP/system.cpu.load.avg1,5m)/last(/TrueNAS SCALE by SNMP/system.cpu.num)>{$LOAD_AVG_PER_CPU.MAX.WARN}

              and last(/TrueNAS SCALE by SNMP/system.cpu.load.avg5)>0

              and last(/TrueNAS SCALE by SNMP/system.cpu.load.avg15)>0

              '
          tags:
          - tag: scope
            value: performance
      graph_prototypes:
      - uuid: e13d96c76c174b08a3ada1e176c48a2f
        name: 'TrueNAS SCALE: CPU usage{#SINGLETON}'
        type: STACKED
        ymin_type_1: FIXED
        ymax_type_1: FIXED
        graph_items:
        - color: 199C0D
          item:
            host: TrueNAS SCALE by SNMP
            key: system.cpu.system[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: TrueNAS SCALE by SNMP
            key: system.cpu.user[{#SNMPINDEX}]
        - sortorder: '2'
          color: 00611C
          item:
            host: TrueNAS SCALE by SNMP
            key: system.cpu.nice[{#SNMPINDEX}]
        - sortorder: '3'
          color: F7941D
          item:
            host: TrueNAS SCALE by SNMP
            key: system.cpu.iowait[{#SNMPINDEX}]
        - sortorder: '4'
          color: FC6EA3
          item:
            host: TrueNAS SCALE by SNMP
            key: system.cpu.interrupt[{#SNMPINDEX}]
      - uuid: e86bcd9edaef46b38404f69d0be26d29
        name: 'TrueNAS SCALE: CPU utilization{#SINGLETON}'
        ymin_type_1: FIXED
        ymax_type_1: FIXED
        graph_items:
        - drawtype: GRADIENT_LINE
          color: 199C0D
          item:
            host: TrueNAS SCALE by SNMP
            key: system.cpu.util[{#SNMPINDEX}]
      master_item:
        key: system.cpu.num
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'return JSON.stringify([{"{#CPU.COUNT}": value, "{#SNMPINDEX}": 0, "{#SINGLETON}":""}])'
    - uuid: 136d467904504628b1134f28e2b07e63
      name: Network interfaces discovery
      type: DEPENDENT
      key: net.if.discovery
      delay: '0'
      filter:
        evaltype: AND
        conditions:
        - macro: '{#IFADMINSTATUS}'
          value: '{$NET.IF.IFADMINSTATUS.MATCHES}'
          formulaid: A
        - macro: '{#IFADMINSTATUS}'
          value: '{$NET.IF.IFADMINSTATUS.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
          formulaid: B
        - macro: '{#IFALIAS}'
          value: '{$NET.IF.IFALIAS.MATCHES}'
          formulaid: C
        - macro: '{#IFALIAS}'
          value: '{$NET.IF.IFALIAS.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
          formulaid: D
        - macro: '{#IFDESCR}'
          value: '{$NET.IF.IFDESCR.MATCHES}'
          formulaid: E
        - macro: '{#IFDESCR}'
          value: '{$NET.IF.IFDESCR.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
          formulaid: F
        - macro: '{#IFNAME}'
          value: '{$NET.IF.IFNAME.MATCHES}'
          formulaid: G
        - macro: '{#IFNAME}'
          value: '{$NET.IF.IFNAME.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
          formulaid: H
        - macro: '{#IFOPERSTATUS}'
          value: '{$NET.IF.IFOPERSTATUS.MATCHES}'
          formulaid: I
        - macro: '{#IFOPERSTATUS}'
          value: '{$NET.IF.IFOPERSTATUS.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
          formulaid: J
        - macro: '{#IFTYPE}'
          value: '{$NET.IF.IFTYPE.MATCHES}'
          formulaid: K
        - macro: '{#IFTYPE}'
          value: '{$NET.IF.IFTYPE.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
          formulaid: L
      description: Discovering interfaces from IF-MIB.
      item_prototypes:
      - uuid: 05389cf8605046f2922a65857e9177f5
        name: 'Interface {#IFNAME}({#IFALIAS}): Inbound packets discarded'
        type: DEPENDENT
        key: net.if.in.discards[ifInDiscards.{#SNMPINDEX}]
        delay: '0'
        description: 'MIB: IF-MIB

          The number of inbound packets which were chosen to be discarded

          even though no errors had been detected to prevent their being deliverable to a higher-layer protocol.

          One possible reason for discarding such a packet could be to free up buffer space.

          Discontinuities in the value of this counter can occur at re-initialization of the management system,

          and at other times as indicated by the value of ifCounterDiscontinuityTime.

          '
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}
          - '0'
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 3m
        master_item:
          key: net.if.walk
        tags:
        - tag: component
          value: network
        - tag: description
          value: '{#IFALIAS}'
        - tag: interface
          value: '{#IFNAME}'
      - uuid: ac3a7126309e441593113e0478b3a7c8
        name: 'Interface {#IFNAME}({#IFALIAS}): Inbound packets with errors'
        type: DEPENDENT
        key: net.if.in.errors[ifInErrors.{#SNMPINDEX}]
        delay: '0'
        description: 'MIB: IF-MIB

          For packet-oriented interfaces, the number of inbound packets that contained errors preventing them from being deliverable to a higher-layer protocol.  For character-oriented or fixed-length interfaces, the number of inbound transmission units that contained errors preventing them from being deliverable to a higher-layer protocol. Discontinuities in the value of this counter can occur at re-initialization of the management system, and at other times as indicated by the value of ifCounterDiscontinuityTime.

          '
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}
          - '0'
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 3m
        master_item:
          key: net.if.walk
        tags:
        - tag: component
          value: network
        - tag: description
          value: '{#IFALIAS}'
        - tag: interface
          value: '{#IFNAME}'
      - uuid: 10609c247ba3440a8085045c17e9430d
        name: 'Interface {#IFNAME}({#IFALIAS}): Bits received'
        type: DEPENDENT
        key: net.if.in[ifHCInOctets.{#SNMPINDEX}]
        delay: '0'
        units: bps
        description: 'MIB: IF-MIB

          The total number of octets received on the interface, including framing characters. This object is a 64-bit version of ifInOctets. Discontinuities in the value of this counter can occur at re-initialization of the management system, and at other times as indicated by the value of ifCounterDiscontinuityTime.

          '
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}
          - '0'
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: MULTIPLIER
          parameters:
          - '8'
        master_item:
          key: net.if.walk
        tags:
        - tag: component
          value: network
        - tag: description
          value: '{#IFALIAS}'
        - tag: interface
          value: '{#IFNAME}'
      - uuid: 705e95a8ae4149bc90148724f844ab03
        name: 'Interface {#IFNAME}({#IFALIAS}): Outbound packets discarded'
        type: DEPENDENT
        key: net.if.out.discards[ifOutDiscards.{#SNMPINDEX}]
        delay: '0'
        description: 'MIB: IF-MIB

          The number of outbound packets which were chosen to be discarded

          even though no errors had been detected to prevent their being deliverable to a higher-layer protocol.

          One possible reason for discarding such a packet could be to free up buffer space.

          Discontinuities in the value of this counter can occur at re-initialization of the management system,

          and at other times as indicated by the value of ifCounterDiscontinuityTime.

          '
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}
          - '0'
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 3m
        master_item:
          key: net.if.walk
        tags:
        - tag: component
          value: network
        - tag: description
          value: '{#IFALIAS}'
        - tag: interface
          value: '{#IFNAME}'
      - uuid: 0725bfa12faa4b16894f3c99d6baccbd
        name: 'Interface {#IFNAME}({#IFALIAS}): Outbound packets with errors'
        type: DEPENDENT
        key: net.if.out.errors[ifOutErrors.{#SNMPINDEX}]
        delay: '0'
        description: 'MIB: IF-MIB

          For packet-oriented interfaces, the number of outbound packets that contained errors preventing them from being deliverable to a higher-layer protocol.  For character-oriented or fixed-length interfaces, the number of outbound transmission units that contained errors preventing them from being deliverable to a higher-layer protocol. Discontinuities in the value of this counter can occur at re-initialization of the management system, and at other times as indicated by the value of ifCounterDiscontinuityTime.

          '
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}
          - '0'
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 3m
        master_item:
          key: net.if.walk
        tags:
        - tag: component
          value: network
        - tag: description
          value: '{#IFALIAS}'
        - tag: interface
          value: '{#IFNAME}'
      - uuid: fd7100e49d9e400baea74441234f72b0
        name: 'Interface {#IFNAME}({#IFALIAS}): Bits sent'
        type: DEPENDENT
        key: net.if.out[ifHCOutOctets.{#SNMPINDEX}]
        delay: '0'
        units: bps
        description: 'MIB: IF-MIB

          The total number of octets transmitted out of the interface, including framing characters. This object is a 64-bit version of ifOutOctets.Discontinuities in the value of this counter can occur at re-initialization of the management system, and at other times as indicated by the value of ifCounterDiscontinuityTime.

          '
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}
          - '0'
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: MULTIPLIER
          parameters:
          - '8'
        master_item:
          key: net.if.walk
        tags:
        - tag: component
          value: network
        - tag: description
          value: '{#IFALIAS}'
        - tag: interface
          value: '{#IFNAME}'
      - uuid: edbc539780e24ae0b17d15b4a0f8032a
        name: 'Interface {#IFNAME}({#IFALIAS}): Speed'
        type: DEPENDENT
        key: net.if.speed[ifHighSpeed.{#SNMPINDEX}]
        delay: '0'
        trends: '0'
        units: bps
        description: 'MIB: IF-MIB

          An estimate of the interface''s current bandwidth in units of 1,000,000 bits per second. If this object reports a value of `n`, then the speed of the interface is somewhere in the range of `n-500,000` to `n+499,999`.

          For interfaces which do not vary in bandwidth or for those where no accurate estimation can be made, this object should contain the nominal bandwidth.

          For a sub-layer which has no concept of bandwidth, this object should be zero.

          '
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.2.1.31.1.1.1.15.{#SNMPINDEX}
          - '0'
        - type: MULTIPLIER
          parameters:
          - '1000000'
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1h
        master_item:
          key: net.if.walk
        tags:
        - tag: component
          value: network
        - tag: description
          value: '{#IFALIAS}'
        - tag: interface
          value: '{#IFNAME}'
      - uuid: ba92fd721fef4682acc9ee1dfd515a97
        name: 'Interface {#IFNAME}({#IFALIAS}): Operational status'
        type: DEPENDENT
        key: net.if.status[ifOperStatus.{#SNMPINDEX}]
        delay: '0'
        trends: '0'
        description: 'MIB: IF-MIB

          The current operational state of the interface.

          - The testing(3) state indicates that no operational packet scan be passed

          - If ifAdminStatus is down(2) then ifOperStatus should be down(2)

          - If ifAdminStatus is changed to up(1) then ifOperStatus should change to up(1) if the interface is ready to transmit and receive network traffic

          - It should change todormant(5) if the interface is waiting for external actions (such as a serial line waiting for an incoming connection)

          - It should remain in the down(2) state if and only if there is a fault that prevents it from going to the up(1) state

          - It should remain in the notPresent(6) state if the interface has missing(typically, hardware) components.

          '
        valuemap:
          name: IF-MIB::ifOperStatus
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}
          - '0'
        master_item:
          key: net.if.walk
        tags:
        - tag: component
          value: network
        - tag: description
          value: '{#IFALIAS}'
        - tag: interface
          value: '{#IFNAME}'
        trigger_prototypes:
        - uuid: f0be97a0d74e47ab8173cdf65a253d01
          expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/TrueNAS SCALE by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2 and (last(/TrueNAS SCALE by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/TrueNAS SCALE by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#2))'
          recovery_mode: RECOVERY_EXPRESSION
          recovery_expression: last(/TrueNAS SCALE by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0
          name: 'TrueNAS SCALE: Interface {#IFNAME}({#IFALIAS}): Link down'
          opdata: 'Current state: {ITEM.LASTVALUE1}'
          priority: AVERAGE
          description: 'This trigger expression works as follows:

            1. It can be triggered if the operations status is down.

            2. `{$IFCONTROL:"{#IFNAME}"}=1` - a user can redefine the context macro to "0", marking this interface as not important. No new trigger will be fired if this interface is down.

            3. `last(/TEMPLATE_NAME/METRIC,#1)<>last(/TEMPLATE_NAME/METRIC,#2)` - the trigger fires only if the operational status was up to (1) sometime before (so, does not fire for "eternal off" interfaces.)


            WARNING: if closed manually - it will not fire again on the next poll, because of .diff.

            '
          manual_close: 'YES'
          tags:
          - tag: scope
            value: availability
      - uuid: be1eb10cfacb4900ad5c81a1db01f66d
        name: 'Interface {#IFNAME}({#IFALIAS}): Interface type'
        type: DEPENDENT
        key: net.if.type[ifType.{#SNMPINDEX}]
        delay: '0'
        trends: '0'
        description: 'MIB: IF-MIB

          The type of interface.

          Additional values for ifType are assigned by the Internet Assigned Numbers Authority (IANA),

          through updating the syntax of the IANAifType textual convention.

          '
        valuemap:
          name: IF-MIB::ifType
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.2.1.2.2.1.3.{#SNMPINDEX}
          - '0'
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1d
        master_item:
          key: net.if.walk
        tags:
        - tag: component
          value: network
        - tag: description
          value: '{#IFALIAS}'
        - tag: interface
          value: '{#IFNAME}'
      trigger_prototypes:
      - uuid: a7883599fec448518c17e00695d09ed4
        expression: 'change(/TrueNAS SCALE by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])<0 and last(/TrueNAS SCALE by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])>0

          and (

          last(/TrueNAS SCALE by SNMP/net.if.type[ifType.{#SNMPINDEX}])=6 or

          last(/TrueNAS SCALE by SNMP/net.if.type[ifType.{#SNMPINDEX}])=7 or

          last(/TrueNAS SCALE by SNMP/net.if.type[ifType.{#SNMPINDEX}])=11 or

          last(/TrueNAS SCALE by SNMP/net.if.type[ifType.{#SNMPINDEX}])=62 or

          last(/TrueNAS SCALE by SNMP/net.if.type[ifType.{#SNMPINDEX}])=69 or

          last(/TrueNAS SCALE by SNMP/net.if.type[ifType.{#SNMPINDEX}])=117

          )

          and

          (last(/TrueNAS SCALE by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2)

          '
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: '(change(/TrueNAS SCALE by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])>0 and last(/TrueNAS SCALE by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}],#2)>0) or

          (last(/TrueNAS SCALE by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2)

          '
        name: 'TrueNAS SCALE: Interface {#IFNAME}({#IFALIAS}): Ethernet has changed to lower speed than it was before'
        opdata: 'Current reported speed: {ITEM.LASTVALUE1}'
        priority: INFO
        description: This Ethernet connection has transitioned down from its known maximum speed. This might be a sign of autonegotiation issues. Acknowledge to close the problem manually.
        manual_close: 'YES'
        dependencies:
        - name: 'TrueNAS SCALE: Interface {#IFNAME}({#IFALIAS}): Link down'
          expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/TrueNAS SCALE by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2 and (last(/TrueNAS SCALE by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/TrueNAS SCALE by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#2))'
          recovery_expression: last(/TrueNAS SCALE by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0
        tags:
        - tag: scope
          value: performance
      - uuid: 703c90cb636744f9946d3e247b0976f2
        expression: '(avg(/TrueNAS SCALE by SNMP/net.if.in[ifHCInOctets.{#SNMPINDEX}],15m)>({$IF.UTIL.MAX:"{#IFNAME}"}/100)*last(/TrueNAS SCALE by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}]) or

          avg(/TrueNAS SCALE by SNMP/net.if.out[ifHCOutOctets.{#SNMPINDEX}],15m)>({$IF.UTIL.MAX:"{#IFNAME}"}/100)*last(/TrueNAS SCALE by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])) and

          last(/TrueNAS SCALE by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])>0

          '
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: 'avg(/TrueNAS SCALE by SNMP/net.if.in[ifHCInOctets.{#SNMPINDEX}],15m)<(({$IF.UTIL.MAX:"{#IFNAME}"}-3)/100)*last(/TrueNAS SCALE by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}]) and

          avg(/TrueNAS SCALE by SNMP/net.if.out[ifHCOutOctets.{#SNMPINDEX}],15m)<(({$IF.UTIL.MAX:"{#IFNAME}"}-3)/100)*last(/TrueNAS SCALE by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])

          '
        name: 'TrueNAS SCALE: Interface {#IFNAME}({#IFALIAS}): High bandwidth usage'
        event_name: 'TrueNAS SCALE: Interface {#IFNAME}({#IFALIAS}): High bandwidth usage (>{$IF.UTIL.MAX:"{#IFNAME}"}%)'
        opdata: 'In: {ITEM.LASTVALUE1}, out: {ITEM.LASTVALUE3}, speed: {ITEM.LASTVALUE2}'
        priority: WARNING
        description: The utilization of the network interface is close to its estimated maximum bandwidth.
        manual_close: 'YES'
        dependencies:
        - name: 'TrueNAS SCALE: Interface {#IFNAME}({#IFALIAS}): Link down'
          expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/TrueNAS SCALE by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2 and (last(/TrueNAS SCALE by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/TrueNAS SCALE by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#2))'
          recovery_expression: last(/TrueNAS SCALE by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0
        tags:
        - tag: scope
          value: performance
      - uuid: 60d8e1fc92534f5c8bf92f3ea6862ebf
        expression: 'min(/TrueNAS SCALE by SNMP/net.if.in.errors[ifInErrors.{#SNMPINDEX}],5m)>{$IF.ERRORS.WARN:"{#IFNAME}"}

          or min(/TrueNAS SCALE by SNMP/net.if.out.errors[ifOutErrors.{#SNMPINDEX}],5m)>{$IF.ERRORS.WARN:"{#IFNAME}"}

          '
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: 'max(/TrueNAS SCALE by SNMP/net.if.in.errors[ifInErrors.{#SNMPINDEX}],5m)<{$IF.ERRORS.WARN:"{#IFNAME}"}*0.8

          and max(/TrueNAS SCALE by SNMP/net.if.out.errors[ifOutErrors.{#SNMPINDEX}],5m)<{$IF.ERRORS.WARN:"{#IFNAME}"}*0.8

          '
        name: 'TrueNAS SCALE: Interface {#IFNAME}({#IFALIAS}): High error rate'
        event_name: 'TrueNAS SCALE: Interface {#IFNAME}({#IFALIAS}): High error rate (>{$IF.ERRORS.WARN:"{#IFNAME}"} for 5m)'
        opdata: 'errors in: {ITEM.LASTVALUE1}, errors out: {ITEM.LASTVALUE2}'
        priority: WARNING
        description: It recovers when it is below 80% of the `{$IF.ERRORS.WARN:"{#IFNAME}"}` threshold.
        manual_close: 'YES'
        dependencies:
        - name: 'TrueNAS SCALE: Interface {#IFNAME}({#IFALIAS}): Link down'
          expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/TrueNAS SCALE by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2 and (last(/TrueNAS SCALE by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/TrueNAS SCALE by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#2))'
          recovery_expression: last(/TrueNAS SCALE by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0
        tags:
        - tag: scope
          value: availability
        - tag: scope
          value: performance
      graph_prototypes:
      - uuid: 3372a724d2f1417891836b3763e85a5c
        name: 'Interface {#IFNAME}({#IFALIAS}): Network traffic'
        graph_items:
        - drawtype: GRADIENT_LINE
          color: 199C0D
          item:
            host: TrueNAS SCALE by SNMP
            key: net.if.in[ifHCInOctets.{#SNMPINDEX}]
        - sortorder: '1'
          drawtype: BOLD_LINE
          color: F63100
          item:
            host: TrueNAS SCALE by SNMP
            key: net.if.out[ifHCOutOctets.{#SNMPINDEX}]
        - sortorder: '2'
          color: 00611C
          yaxisside: RIGHT
          item:
            host: TrueNAS SCALE by SNMP
            key: net.if.out.errors[ifOutErrors.{#SNMPINDEX}]
        - sortorder: '3'
          color: F7941D
          yaxisside: RIGHT
          item:
            host: TrueNAS SCALE by SNMP
            key: net.if.in.errors[ifInErrors.{#SNMPINDEX}]
        - sortorder: '4'
          color: FC6EA3
          yaxisside: RIGHT
          item:
            host: TrueNAS SCALE by SNMP
            key: net.if.out.discards[ifOutDiscards.{#SNMPINDEX}]
        - sortorder: '5'
          color: 6C59DC
          yaxisside: RIGHT
          item:
            host: TrueNAS SCALE by SNMP
            key: net.if.in.discards[ifInDiscards.{#SNMPINDEX}]
      master_item:
        key: net.if.walk
      preprocessing:
      - type: SNMP_WALK_TO_JSON
        parameters:
        - '{#IFOPERSTATUS}'
        - 1.3.6.1.2.1.2.2.1.8
        - '0'
        - '{#IFADMINSTATUS}'
        - 1.3.6.1.2.1.2.2.1.7
        - '0'
        - '{#IFALIAS}'
        - 1.3.6.1.2.1.31.1.1.1.18
        - '0'
        - '{#IFNAME}'
        - 1.3.6.1.2.1.31.1.1.1.1
        - '0'
        - '{#IFDESCR}'
        - 1.3.6.1.2.1.2.2.1.2
        - '0'
        - '{#IFTYPE}'
        - 1.3.6.1.2.1.2.2.1.3
        - '0'
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
    - uuid: 84269deae319408d9a9d13943c1a2a8e
      name: Disks temperature discovery
      type: DEPENDENT
      key: truenas.disk.temp.discovery
      delay: '0'
      description: Disks temperature discovery from TRUENAS-MIB.
      item_prototypes:
      - uuid: cbbd0e89c3254b279e471d945d9ad0f5
        name: 'Disk [{#DISK_NAME}]'': Temperature'
        type: DEPENDENT
        key: truenas.disk.temp[{#DISK_NAME}]
        delay: '0'
        value_type: FLOAT
        units: C
        description: 'MIB: TRUENAS-MIB

          The temperature of this HDD in mC.

          '
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.4.1.50536.3.1.3.{#SNMPINDEX}
          - '0'
        - type: MULTIPLIER
          parameters:
          - '0.001'
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1h
        master_item:
          key: truenas.disk.temp.walk
        tags:
        - tag: component
          value: storage
        - tag: disk
          value: '{#DISK_NAME}'
        trigger_prototypes:
        - uuid: 3dd7e04d6a56425f9bee61a2cb015e85
          expression: avg(/TrueNAS SCALE by SNMP/truenas.disk.temp[{#DISK_NAME}],5m) > {$TEMPERATURE.MAX.CRIT:"{#DISK_NAME}"}
          name: 'TrueNAS SCALE: Disk [{#DISK_NAME}]'': Average disk temperature is too high'
          event_name: 'TrueNAS SCALE: Disk [{#DISK_NAME}]'': Average disk temperature is too high (over {$TEMPERATURE.MAX.CRIT:"{#DISK_NAME}"}C for 5m)'
          opdata: 'Current value: {ITEM.LASTVALUE1}'
          priority: AVERAGE
          description: Disk temperature is high.
          tags:
          - tag: scope
            value: notice
        - uuid: 06c6517a2ca9432b82150c4216a7531c
          expression: avg(/TrueNAS SCALE by SNMP/truenas.disk.temp[{#DISK_NAME}],5m) > {$TEMPERATURE.MAX.WARN:"{#DISK_NAME}"}
          name: 'TrueNAS SCALE: Disk [{#DISK_NAME}]'': Average disk temperature is too high'
          event_name: 'TrueNAS SCALE: Disk [{#DISK_NAME}]'': Average disk temperature is too high (over {$TEMPERATURE.MAX.WARN:"{#DISK_NAME}"}C for 5m)'
          opdata: 'Current value: {ITEM.LASTVALUE1}'
          priority: WARNING
          description: Disk temperature is high.
          tags:
          - tag: scope
            value: notice
      graph_prototypes:
      - uuid: 06acc8c910de4cd597c83519e23f16fb
        name: 'Disk [{#DISK_NAME}]'': Temperature'
        graph_items:
        - color: 199C0D
          item:
            host: TrueNAS SCALE by SNMP
            key: truenas.disk.temp[{#DISK_NAME}]
      master_item:
        key: truenas.disk.temp.walk
      preprocessing:
      - type: SNMP_WALK_TO_JSON
        parameters:
        - '{#DISK_NAME}'
        - 1.3.6.1.4.1.50536.3.1.2
        - '0'
        error_handler: DISCARD_VALUE
      - type: DISCARD_UNCHANGED_HEARTBEAT
