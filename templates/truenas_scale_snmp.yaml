    - uuid: 8aaf31c6d7a649e1b12498cc8868058c
      name: Block devices discovery
      type: DEPENDENT
      key: vfs.dev.discovery
      delay: '0'
      filter:
        evaltype: AND
        conditions:
        - macro: '{#DEVNAME}'
          value: '{$VFS.DEV.DEVNAME.MATCHES}'
          formulaid: A
        - macro: '{#DEVNAME}'
          value: '{$VFS.DEV.DEVNAME.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
          formulaid: B
      description: Block devices are discovered from UCD-DISKIO-MIB::diskIOTable (http://net-snmp.sourceforge.net/docs/mibs/ucdDiskIOMIB.html#diskIOTable).
      item_prototypes:
      - uuid: a653475e977241e0a759177cc9004b6d
        name: 'TrueNAS SCALE: [{#DEVNAME}]: Disk read rate'
        type: DEPENDENT
        key: vfs.dev.read.rate[{#SNMPINDEX}]
        delay: '0'
        value_type: FLOAT
        units: '!r/s'
        description: 'MIB: UCD-DISKIO-MIB

          The number of read accesses from this device since boot.

          '
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.4.1.2021.13.15.1.1.5.{#SNMPINDEX}
          - '0'
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        master_item:
          key: vfs.dev.walk
        tags:
        - tag: component
          value: storage
        - tag: disk
          value: '{#DEVNAME}'
      - uuid: 7da12349263b4030b9bbd75b4a229bd4
        name: 'TrueNAS SCALE: [{#DEVNAME}]: Disk utilization'
        type: DEPENDENT
        key: vfs.dev.util[{#SNMPINDEX}]
        delay: '0'
        value_type: FLOAT
        units: '%'
        description: 'MIB: UCD-DISKIO-MIB

          The 1 minute average load of disk (%).

          '
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.4.1.2021.13.15.1.1.9.{#SNMPINDEX}
          - '0'
        master_item:
          key: vfs.dev.walk
        tags:
        - tag: component
          value: storage
        - tag: disk
          value: '{#DEVNAME}'
      - uuid: 9a2d2d105b7b49839fadb74cd5f380b8
        name: 'TrueNAS SCALE: [{#DEVNAME}]: Disk write rate'
        type: DEPENDENT
        key: vfs.dev.write.rate[{#SNMPINDEX}]
        delay: '0'
        value_type: FLOAT
        units: '!w/s'
        description: 'MIB: UCD-DISKIO-MIB

          The number of write accesses from this device since boot.

          '
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.4.1.2021.13.15.1.1.6.{#SNMPINDEX}
          - '0'
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        master_item:
          key: vfs.dev.walk
        tags:
        - tag: component
          value: storage
        - tag: disk
          value: '{#DEVNAME}'
      graph_prototypes:
      - uuid: d7bc94c269864a89a82058cd0bead663
        name: 'TrueNAS SCALE: [{#DEVNAME}]: Read/write rates'
        graph_items:
        - color: 199C0D
          item:
            host: TrueNAS SCALE by SNMP
            key: vfs.dev.read.rate[{#SNMPINDEX}]
        - sortorder: '1'
          drawtype: GRADIENT_LINE
          color: F63100
          item:
            host: TrueNAS SCALE by SNMP
            key: vfs.dev.write.rate[{#SNMPINDEX}]
      master_item:
        key: vfs.dev.walk
      preprocessing:
      - type: SNMP_WALK_TO_JSON
        parameters:
        - '{#DEVNAME}'
        - 1.3.6.1.4.1.2021.13.15.1.1.2
        - '0'
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
